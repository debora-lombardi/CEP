<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEP</title>
    <link rel="stylesheet" href="./src/style/style.css">
    <script src="./src/js/script.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <img src="./src/assets/image/logo.svg" alt="logo e-comerce" loading="lazy">

        <nav class="nav-header">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">Produtos</a></li>
                <li><a href="">Sobre nós</a></li>
                <li><a href="">Contato</a></li>
            </ul>
        </nav>

        <a href="" class="container-btn">Login</a>

    </header>

    <main>
        <img src="./src/assets/image/Product.svg" alt="">

        <div class="container-main">

            <div class="avaliacao">
                <div class="estrelas">
                    <img src="./src/assets/image/estrelas-img.svg" alt="estrela da avaliação">
                    <img src="./src/assets/image/estrelas-img.svg" alt="estrela da avaliação">
                    <img src="./src/assets/image/estrelas-img.svg" alt="estrela da avaliação">
                    <img src="./src/assets/image/estrelas-img.svg" alt="estrela da avaliação">
                    <img src="./src/assets/image/estrelas-img.svg" alt="estrela da avaliação">
                </div>
                <span class="qtd-estrelas">5.0 Estrelas</span> 
                <span class="qtd-avaliacao">(21.671 avaliações)</span>
            </div>

            <h1>2020 Apple MacBook Pro with Apple M1 Chip (13-inch, 8GB RAM, 256GB SSD Storage) - Space Gray</h1>
            
            <div class="precos-produto">
                <span class="preco-desconto">R$5.299,00</span>
                <span class="preco-original">R$7.000,00</span>
                <span class="porcentagem-desconto">24,3% OFF</span>
            </div>

            <div class="container-cor">
                <p>Cor</p>
                <div class="tipo-cores">
                    <option value="" class="cor-formato cor-1"></option>
                    <option value="" class="cor-formato cor-2"></option>
                </div>                
            </div>

            <button class="container-btn btn-carrinho">Adicionar no carrinho</button>

        </div>

    </main>

</body>
</html>
